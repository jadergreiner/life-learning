<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="850" viewBox="0 0 1440 850">
<defs><style>
text{font-family:Arial,Helvetica,sans-serif;fill:#142840} .title{font-weight:700;font-size:36px} .subtitle{font-size:19px;fill:#4c6078} .heading{font-weight:700;font-size:20px} .body{font-size:16px} .small{font-size:14px} .line{fill:none;stroke:#215c95;stroke-width:3;marker-end:url(#arrow)} .monitor{fill:none;stroke:#7d45b2;stroke-width:2.5;marker-end:url(#purple)} .card{stroke-width:2;rx:14} </style>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#215c95"/></marker>
<marker id="purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#7d45b2"/></marker>
</defs>
<rect width="1440" height="850" fill="#fafcff"/><rect x="28" y="28" width="8" height="76" fill="#2671c2"/><text x="57" y="66" class="title">ED-05 U2 — Arquitetura da Solução</text><text x="57" y="96" class="subtitle">Processamento financeiro idempotente • SQS Standard → Lambda → PostgreSQL</text>
<rect x="28" y="125" width="1384" height="528" rx="18" fill="white" stroke="#426c9d" stroke-width="2" stroke-dasharray="8 7"/>
<text x="48" y="160" class="heading">Terraform (infraestrutura como código) — desenho de referência, não provisionado</text>
<rect x="1070" y="142" width="300" height="65" rx="14" fill="#f5ecfb" stroke="#8c51ac" stroke-width="2"/><text x="1090" y="170" class="heading">CloudWatch</text><text x="1090" y="193" class="body">Logs, métricas e alarmes</text>
<rect x="54" y="265" width="280" height="227" class="card" fill="#eaf3ff" stroke="#3875b4"/><text x="72" y="297" class="heading">Produtor de eventos</text><text x="72" y="322" class="body">Sistema de origem</text><text x="72" y="356" class="small">event_id: EVT-123</text><text x="72" y="380" class="small">account_id: ACC-001</text><text x="72" y="404" class="small">operation: CREDIT</text><text x="72" y="428" class="small">amount: 100.00</text><text x="72" y="452" class="small">currency: BRL</text>
<rect x="385" y="265" width="274" height="227" class="card" fill="#f3eaff" stroke="#7942bd"/><text x="401" y="302" class="heading">Amazon SQS Standard</text><text x="401" y="354" class="body">• At-least-once</text><text x="401" y="386" class="body">• Duplicatas possíveis</text><text x="401" y="418" class="body">• Sem ordenação garantida</text>
<rect x="737" y="266" width="272" height="84" class="card" fill="#fff1e3" stroke="#d16d20"/><text x="759" y="301" class="heading">AWS Lambda A</text><text x="759" y="327" class="small">Execução concorrente</text>
<rect x="737" y="404" width="272" height="84" class="card" fill="#fff1e3" stroke="#d16d20"/><text x="759" y="439" class="heading">AWS Lambda B</text><text x="759" y="465" class="small">Retries e reentregas</text>
<rect x="1071" y="255" width="300" height="269" class="card" fill="#e9f3ff" stroke="#2567a7"/><text x="1088" y="290" class="heading">RDS PostgreSQL</text><text x="1088" y="318" class="small">Autoridade transacional</text><path d="M1086 334 H1353" stroke="#9cb6ce"/><text x="1088" y="365" class="body">Eventos / ledger</text><text x="1088" y="399" class="body">Contas / saldos</text><text x="1088" y="433" class="body">UNIQUE(event_id)</text><text x="1088" y="467" class="body">Transação atômica</text><text x="1088" y="498" class="small">Um efeito por evento confirmado</text>
<path d="M334 379 H385" class="line"/><path d="M659 379 H698 V308 H737" class="line"/><path d="M698 379 V447 H737" class="line"/><path d="M1009 308 H1040 V379 H1071" class="line"/><path d="M1009 447 H1040 V379" class="line"/>
<rect x="386" y="532" width="275" height="88" class="card" fill="#fff0f1" stroke="#bb414d"/><text x="403" y="568" class="heading">Dead-letter queue (DLQ)</text><text x="403" y="596" class="small">Falhas recorrentes e recuperação</text><path d="M520 492 V532" class="line"/>
<rect x="737" y="531" width="635" height="90" class="card" fill="#eaf8ea" stroke="#45964c"/><text x="755" y="560" class="body">Reentrega após COMMIT → verificar event_id confirmado</text><text x="755" y="588" class="body">→ não reaplicar efeito financeiro.</text>
<path d="M844 266 V190 H1070" class="monitor"/><path d="M520 265 V225 H1070" class="monitor"/>
<text x="44" y="695" class="heading">Fluxo transacional de referência</text>
<rect x="44" y="711" width="1350" height="55" rx="10" fill="#e8f1fc" stroke="#7f9fc8"/><text x="61" y="745" class="body">SQS → Lambda → BEGIN → deduplicação por event_id → efeito no saldo + ledger → COMMIT → confirmação ao SQS</text>
<rect x="44" y="784" width="1350" height="49" rx="10" fill="#fff1da" stroke="#d5a23b"/><text x="58" y="814" class="body">Risco residual: reentrega/DLQ após commit. Exige reconciliação operacional; não implica duplicação financeira.</text>
</svg>